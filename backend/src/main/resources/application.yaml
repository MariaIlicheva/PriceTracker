spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:pricetracker}
    username: ${DB_USER:pricetracker}
    password: ${DB_PASSWORD:password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Hibernate НЕ создаёт таблицы, только сверяет их с кодом
    properties:
      hibernate:
        hbm2ddl:
          extra_physical_table_types: PARTITIONED TABLE
pricetracker:
  parsing:
    cron: "0 0 9,21 * * *"   # секунды минуты часы день месяц день_недели — 9:00 и 21:00 по Москве
    workers: 2               # сколько обработчиков разбирают очередь одновременно
    poll-interval-ms: 10000  # как часто обработчики проверяют, нет ли новых задач
    request-delay-ms: 1500   # пауза между запросами к сайтам, чтобы не нагружать их
    retry-delay: 2m          # через сколько повторить неудачную попытку
    stale-after: 10m         # задача дольше этого считается зависшей
