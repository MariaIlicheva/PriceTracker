name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/scripts/check-frontend-links.cjs"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/scripts/check-frontend-links.cjs"

jobs:
  check:
    name: Проверка и упаковка статики
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверить синтаксис JavaScript
        run: |
          status=0
          for file in $(find frontend/js -name '*.js' | sort); do
            if node --input-type=module --check < "$file"; then
              echo "OK   $file"
            else
              echo "FAIL $file"
              status=1
            fi
          done
          exit $status

      - name: Проверить ссылки между файлами
        run: node .github/scripts/check-frontend-links.cjs

      - name: Проверить конфигурацию nginx
        run: |
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Сохранить готовые файлы фронтенда
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: |
            frontend/
            !frontend/nginx.conf
          if-no-files-found: error