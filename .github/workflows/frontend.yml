name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/scripts/check-frontend-links.cjs"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/scripts/check-frontend-links.cjs"

jobs:
  check:
    name: Проверка, сборка образа и упаковка статики
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверить синтаксис JavaScript
        run: |
          status=0
          for file in $(find frontend/js -name '*.js' | sort); do
            if node --input-type=module --check < "$file"; then
              echo "OK   $file"
            else
              echo "FAIL $file"
              status=1
            fi
          done
          exit $status

      - name: Проверить ссылки между файлами
        run: node .github/scripts/check-frontend-links.cjs

      - name: Собрать Docker-образ
        run: docker build -t pricetracker-frontend frontend

      - name: Проверить конфигурацию nginx в образе
        run: docker run --rm --add-host backend:127.0.0.1 pricetracker-frontend nginx -t

      - name: Сохранить готовые файлы фронтенда
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: |
            frontend/
            !frontend/Dockerfile
            !frontend/nginx.conf.template
          if-no-files-found: error