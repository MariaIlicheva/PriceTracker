services:
  db:
    image: postgres:16
    container_name: pricetracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"   # для DBeaver и для бэкенда, запущенного из IDEA
    volumes:
      - pgdata:/var/lib/postgresql/data   # хранить данные вне контейнера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: pricetracker-backend
    container_name: pricetracker-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SSL: ${MAIL_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-PriceTracker <noreply@pricetracker.local>}
      SITE_URL: ${SITE_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    image: pricetracker-frontend
    container_name: pricetracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21.0
    container_name: pricetracker-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP: сюда бэкенд отправляет письма
      - "8025:8025"   # веб-интерфейс: http://localhost:8025

volumes:
  pgdata: