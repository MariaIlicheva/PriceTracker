services:
  db:
    image: postgres:16
    container_name: pricetracker-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # хранить данные вне контейнера

  frontend:
    image: nginx:1.27-alpine
    container_name: pricetracker-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro                       # файлы сайта; правки видны сразу
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # наши настройки nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"                       # адрес компьютера изнутри контейнера

volumes:
  pgdata: