<svg xmlns="http://www.w3.org/2000/svg" width="896" height="572" viewBox="0 0 896 572" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Архитектура PriceTracker</title>
  <desc>Пользователь работает в браузере с фронтендом на nginx, который отдаёт страницы и проксирует /api на бэкенд Spring Boot. Бэкенд состоит из модулей обработки запросов и фоновых модулей; все они работают с PostgreSQL. Модуль парсинга обращается к маркетплейсам, модуль писем отправляет почту через SMTP. Фронтенд, бэкенд и база запускаются в docker compose.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th { font-size: 13px; font-weight: 600; fill: #1e293b; }
      .ts { font-size: 11.5px; fill: #475569; }
      .lbl { font-size: 11px; font-weight: 600; fill: #64748b; letter-spacing: .04em; }
      .grp { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .arr { stroke: #475569; stroke-width: 1.4; fill: none; }
      .box rect { fill: #ffffff; stroke: #cbd5e1; }
    </style>
  </defs>

  <rect x="0" y="0" width="896" height="572" fill="#ffffff"/>

  <!-- Пользователь -->
  <g class="box"><rect x="260" y="18" width="200" height="52" rx="8" stroke-width="1"/>
    <text class="th" x="360" y="38" text-anchor="middle" dominant-baseline="central">Пользователь</text>
    <text class="ts" x="360" y="56" text-anchor="middle" dominant-baseline="central">браузер</text></g>
  <line x1="360" y1="70" x2="360" y2="120" class="arr" marker-end="url(#arrow)"/>

  <!-- docker compose -->
  <rect x="20" y="88" width="680" height="462" rx="18" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text class="lbl" x="36" y="106">DOCKER COMPOSE</text>

  <!-- Фронтенд -->
  <rect x="40" y="122" width="640" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text class="th" x="360" y="142" text-anchor="middle" dominant-baseline="central">frontend · nginx</text>
  <text class="ts" x="360" y="160" text-anchor="middle" dominant-baseline="central">страницы и формы (HTML, CSS, JS), график цен · проксирует /api на backend</text>
  <line x1="360" y1="178" x2="360" y2="214" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="370" y="199">REST API /api/v1, JSON, сессия в cookie</text>

  <!-- Бэкенд -->
  <rect x="40" y="216" width="640" height="208" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text class="grp" x="56" y="238">backend · Spring Boot 3, Java 21</text>
  <text class="lbl" x="56" y="259">ПО ЗАПРОСАМ ПОЛЬЗОВАТЕЛЯ</text>

  <g class="box"><rect x="56" y="266" width="143" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="127.5" y="286" text-anchor="middle" dominant-baseline="central">REST API</text>
    <text class="ts" x="127.5" y="304" text-anchor="middle" dominant-baseline="central">контроллеры</text></g>
  <g class="box"><rect x="211" y="266" width="143" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="282.5" y="286" text-anchor="middle" dominant-baseline="central">Безопасность</text>
    <text class="ts" x="282.5" y="304" text-anchor="middle" dominant-baseline="central">сессии, bcrypt</text></g>
  <g class="box"><rect x="366" y="266" width="143" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="437.5" y="286" text-anchor="middle" dominant-baseline="central">Товары и ссылки</text>
    <text class="ts" x="437.5" y="304" text-anchor="middle" dominant-baseline="central">маркетплейс по домену</text></g>
  <g class="box"><rect x="521" y="266" width="143" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="592.5" y="286" text-anchor="middle" dominant-baseline="central">История цен</text>
    <text class="ts" x="592.5" y="304" text-anchor="middle" dominant-baseline="central">данные графика, кеш</text></g>

  <text class="lbl" x="56" y="345">В ФОНЕ, ПО РАСПИСАНИЮ</text>
  <g class="box"><rect x="56" y="352" width="143" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="127.5" y="372" text-anchor="middle" dominant-baseline="central">Планировщик</text>
    <text class="ts" x="127.5" y="390" text-anchor="middle" dominant-baseline="central">09:00 и 21:00 МСК</text></g>
  <g class="box"><rect x="211" y="352" width="143" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="282.5" y="372" text-anchor="middle" dominant-baseline="central">Обслуживание БД</text>
    <text class="ts" x="282.5" y="390" text-anchor="middle" dominant-baseline="central">секции, 30 дней</text></g>
  <g class="box"><rect x="366" y="352" width="143" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="437.5" y="372" text-anchor="middle" dominant-baseline="central">Письма</text>
    <text class="ts" x="437.5" y="390" text-anchor="middle" dominant-baseline="central">очередь уведомлений</text></g>
  <g class="box"><rect x="521" y="352" width="143" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="592.5" y="372" text-anchor="middle" dominant-baseline="central">Парсинг</text>
    <text class="ts" x="592.5" y="390" text-anchor="middle" dominant-baseline="central">очередь, SKIP LOCKED</text></g>

  <!-- Бэкенд ⇄ БД -->
  <line x1="360" y1="426" x2="360" y2="460" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="447" text-anchor="end">JPA (Hibernate) и SQL</text>

  <!-- PostgreSQL -->
  <rect x="40" y="462" width="640" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text class="th" x="360" y="480" text-anchor="middle" dominant-baseline="central">PostgreSQL 16 · схема через миграции Flyway</text>
  <text class="ts" x="360" y="499" text-anchor="middle" dominant-baseline="central">users · marketplaces · products · links · product_links · price_history · parse_jobs · notifications</text>
  <text class="ts" x="360" y="517" text-anchor="middle" dominant-baseline="central">триггеры: проверка порога, обновление last_price, удаление ненужных ссылок · price_history по дням</text>

  <!-- Внешние сервисы -->
  <text class="lbl" x="716" y="342">ВНЕШНИЕ СЕРВИСЫ</text>
  <g class="box"><rect x="716" y="352" width="160" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="796" y="372" text-anchor="middle" dominant-baseline="central">Маркетплейсы</text>
    <text class="ts" x="796" y="390" text-anchor="middle" dominant-baseline="central">WB, Ozon, ЯМ, Купер, Ali</text></g>
  <line x1="664" y1="380" x2="714" y2="380" class="arr" marker-end="url(#arrow)"/>

  <g class="box"><rect x="716" y="440" width="160" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="796" y="460" text-anchor="middle" dominant-baseline="central">Почтовый сервер</text>
    <text class="ts" x="796" y="478" text-anchor="middle" dominant-baseline="central">SMTP</text></g>
  <path d="M437.5 408 V 444 H 714" class="arr" marker-end="url(#arrow)"/>
</svg>
